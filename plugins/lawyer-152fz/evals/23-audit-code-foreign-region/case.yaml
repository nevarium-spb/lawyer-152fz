schema_version: '1'
name: 23-audit-code-foreign-region
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Проверь исходники нашего проекта в текущей рабочей папке на соответствие 152-ФЗ. Ничего в проекте не меняй — только отчёт.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
    - Skill
    - Agent
    - Read
    - Glob
    - Grep
    - mcp__plugin_lawyer-152fz_lawyer-152fz__audit_codebase
    - mcp__plugin_lawyer-152fz_lawyer-152fz__search_norms
    - mcp__plugin_lawyer-152fz_lawyer-152fz__get_norm
runs: 1
graders:
  - name: cites-norm
    type: regex
    target: last_message
    match: contains
    weight: 2
    pattern: 152-fz/art-18
  - name: disclaimer
    type: regex
    target: last_message
    match: contains
    weight: 1
    pattern: не заменяет консультацию юриста
  - name: legal-substance
    type: llm
    focus: last_message
    weight: 3
    criteria: |-
      В проекте база клиентов развёрнута в AWS, регион eu-central-1 (Франкфурт).

      Ответ должен:

      - указать, что база с персональными данными находится за пределами России, и что это противоречит требованию о локализации: запись и хранение персональных данных граждан РФ при сборе — в базах на территории РФ (ч. 5 ст. 18 152-ФЗ);
      - упомянуть ответственность по КоАП (ст. 13.11) или порекомендовать перенести базу в российский ЦОД;
      - не утверждать, что ассистент уже изменил файлы проекта.

      Провал, если ответ не замечает зарубежную базу или содержит явно неверное утверждение о законе.
  - name: used-audit-codebase
    type: tool_used
    tool: mcp__plugin_lawyer-152fz_lawyer-152fz__audit_codebase
    min: 1
    weight: 3
