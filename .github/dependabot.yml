# Политика ADR-0009: всегда последние версии, включая мажорные. Проверка ежедневно.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      # Исключение ADR-0009: пакет `typescript` — только движок typescript-eslint, который не поддерживает TS 7
      # (typescript-eslint/typescript-eslint#10940). Сам TS 7 уже проверяет типы (алиас tsc7) и обновляется.
      # Снять, когда typescript-eslint поддержит TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      all-actions:
        patterns: ['*']
