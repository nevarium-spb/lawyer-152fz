name: Release

# Релиз по тегу vX.Y.Z (ADR-0005): полная проверка → сборка сервера → плагин с бандлом
# публикуется в ветку `release`, откуда его ставит маркетплейс (source: git-subdir, ref: release).
# В main собранный бандл не коммитится.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

      - name: Версия тега совпадает с манифестами
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const read = (p) => JSON.parse(require("fs").readFileSync(p, "utf8"));
            const versions = {
              "plugin.json": read("plugins/lawyer-152fz/.claude-plugin/plugin.json").version,
              "marketplace.json": read(".claude-plugin/marketplace.json").plugins[0].version,
              "mcp-server": read("packages/mcp-server/package.json").version,
            };
            const wrong = Object.entries(versions).filter(([, v]) => v !== tag);
            if (wrong.length) { console.error(`Тег v${tag} не совпадает: ${JSON.stringify(versions)}`); process.exit(1); }
          '

      # Включает сборку бандла и его дымовой запуск (старт < 1 с).
      - run: pnpm check

      - name: Публикация плагина в ветку release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create release-build
          git add --force plugins/lawyer-152fz/server/index.mjs
          git commit --message "release ${GITHUB_REF_NAME}: плагин с собранным MCP-сервером"
          git push --force origin HEAD:release

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Lawyer 152-FZ $GITHUB_REF_NAME" \
            --notes "Установка: \`/plugin marketplace add nevarium-spb/lawyer-152fz\`, затем \`/plugin install lawyer-152fz@lawyer-152fz\`. Результат носит справочный характер и не заменяет консультацию юриста." \
            plugins/lawyer-152fz/server/index.mjs
